<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Favicon: High-contrast silhouette legible at 16x16 and 32x32 -->
  <defs>
    <linearGradient id="favKey" x1="12" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="16" cy="27" rx="12" ry="3" fill="#000000" opacity="0.4" />

  <!-- Isometric Document (Clean High-Contrast Silhouette) -->
  <polygon points="6,12 21,7 26,20 11,25" fill="#ffffff" stroke="#999999" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Thickness Edge -->
  <polygon points="11,25 26,20 26,22 11,27" fill="#666666" />
  <polygon points="6,12 11,25 11,27 6,14" fill="#999999" />

  <!-- Highlighted Clause Line Under Lens (Vibrant Cyan) -->
  <line x1="9" y1="18" x2="23" y2="13" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- KEY-MAGNIFYING GLASS (Bold Iconic Silhouette) -->
  <!-- Shadow -->
  <circle cx="15" cy="15" r="7" fill="#000000" opacity="0.3" />

  <!-- Key Handle Shaft -->
  <line x1="19" y1="18" x2="27" y2="26" stroke="url(#favKey)" stroke-width="3" stroke-linecap="round" />

  <!-- Classic Key Teeth (Distinct Bit) -->
  <path d="M 23,22 L 21,24 M 25,24 L 23,26" stroke="#999999" stroke-width="2.5" stroke-linecap="round" />

  <!-- Magnifying Glass Lens Bezel -->
  <circle cx="13" cy="13" r="6.5" fill="#111111" stroke="url(#favKey)" stroke-width="2.5" />

  <!-- Glass Highlight / Glare -->
  <circle cx="13" cy="13" r="4.5" fill="#ffffff" opacity="0.35" />
  <path d="M 9.5,12 C 9.5,10 11,9 13,9" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
</svg>
