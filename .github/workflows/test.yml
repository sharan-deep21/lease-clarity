name: LeaseClarity CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Backend Pytest Suite with Coverage
        env:
          GEMINI_API_KEY: "dummy_ci_key"
          GEMINI_MODEL: "gemini-3.1-flash-lite"
        run: |
          cd backend
          python -m pytest -o pythonpath=. --cov=app --cov-report=term-missing ../tests

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Vitest Suite
        run: |
          cd frontend
          npm test

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
