<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ground Shadow Filter -->
    <filter id="heroGroundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" />
    </filter>

    <!-- Floating Key-Lens Drop Shadow on Paper -->
    <filter id="heroLensPaperShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="14" dy="22" />
      <feComponentTransfer><feFuncA type="linear" slope="0.38" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Active Clause Glow -->
    <filter id="heroCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Document Stack Gradients -->
    <linearGradient id="heroPaperStack3" x1="120" y1="200" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="heroPaperStack2" x1="120" y1="200" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Top Paper Face -->
    <linearGradient id="heroPaperFace" x1="140" y1="170" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8f8f8" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <!-- Paper Edge Thickness -->
    <linearGradient id="heroPaperEdgeBottom" x1="180" y1="370" x2="390" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#999999" />
      <stop offset="50%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#666666" />
    </linearGradient>

    <linearGradient id="heroPaperEdgeLeft" x1="130" y1="200" x2="180" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#999999" />
    </linearGradient>

    <!-- Metallic Key & Lens Bezel Gradients -->
    <linearGradient id="heroKeyMetallic" x1="210" y1="180" x2="430" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#d0d0d0" />
      <stop offset="45%" stop-color="#a0a0a0" />
      <stop offset="70%" stop-color="#666666" />
      <stop offset="90%" stop-color="#555555" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <linearGradient id="heroBezelRim" x1="160" y1="160" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a0a0a0" />
      <stop offset="70%" stop-color="#555555" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- Convex Glass Shader -->
    <radialGradient id="heroGlassConvex" cx="220" cy="225" r="70" fx="205" fy="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="28%" stop-color="#e0e0e0" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#a0a0a0" stop-opacity="0.2" />
      <stop offset="88%" stop-color="#666666" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.65" />
    </radialGradient>

    <!-- Glass Crescent Glare -->
    <linearGradient id="heroGlassGlare" x1="170" y1="175" x2="230" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Active Clause Highlight Bar Gradient -->
    <linearGradient id="heroClauseGlowGrad" x1="180" y1="280" x2="350" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cccccc" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
  </defs>

  <!-- 1. Deep Ground Plane Soft Shadow -->
  <ellipse cx="265" cy="385" rx="175" ry="42" fill="#050505" opacity="0.55" filter="url(#heroGroundShadow)" />

  <!-- =====================================================================
       2. ISOMETRIC DOCUMENT STACK (3-LAYER DEPTH)
       ===================================================================== -->
  <!-- Layer 3: Bottom Sheet (Slightly Angled) -->
  <g transform="translate(6, 14)">
    <polygon points="126,198 334,138 392,306 184,366" fill="url(#heroPaperStack3)" stroke="#333333" stroke-width="1" />
  </g>

  <!-- Layer 2: Middle Sheet -->
  <g transform="translate(3, 7)">
    <polygon points="128,199 336,139 391,308 183,368" fill="url(#heroPaperStack2)" stroke="#444444" stroke-width="1" />
  </g>

  <!-- Layer 1: Top Document - Extruded Thickness Sides -->
  <!-- Bottom Edge Thickness -->
  <polygon points="180,370 390,310 390,322 180,382" fill="url(#heroPaperEdgeBottom)" />
  <!-- Left Edge Thickness -->
  <polygon points="130,200 180,370 180,382 130,212" fill="url(#heroPaperEdgeLeft)" />

  <!-- Top Document Main Face (Isometric Surface) -->
  <polygon points="130,200 340,140 390,310 180,370" fill="url(#heroPaperFace)" stroke="#cccccc" stroke-width="1.5" />

  <!-- Document Header Seal & Title -->
  <!-- Document Header Bar -->
  <path d="M 160,210 L 225,191" stroke="#999999" stroke-width="5" stroke-linecap="round" />
  <path d="M 160,222 L 205,209" stroke="#cccccc" stroke-width="3" stroke-linecap="round" />
  <!-- Small Legal Seal Stamp -->
  <ellipse cx="320" cy="180" rx="9" ry="6" fill="#e0e0e0" stroke="#999999" stroke-width="1.5" />

  <!-- Document Body Clause Lines (Normal / Unfocused) -->
  <!-- Clause Line 1 -->
  <path d="M 165,242 L 345,191" stroke="#cccccc" stroke-width="3" stroke-linecap="round" />
  <!-- Clause Line 2 -->
  <path d="M 172,266 L 352,215" stroke="#cccccc" stroke-width="3" stroke-linecap="round" />

  <!-- Clause Line 3 (THE ACTIVE HIGHLIGHTED TARGET LINE BENEATH LENS) -->
  <!-- Glowing Background Highlight Bar -->
  <path d="M 180,290 L 360,239" stroke="url(#heroClauseGlowGrad)" stroke-width="10" stroke-linecap="round" opacity="0.4" filter="url(#heroCyanGlow)" />
  <!-- Focused Text Core Line -->
  <path d="M 180,290 L 360,239" stroke="#666666" stroke-width="4.5" stroke-linecap="round" />
  <!-- Active Section Symbol marker § -->
  <circle cx="172" cy="292" r="3.5" fill="#666666" />

  <!-- Clause Line 4 -->
  <path d="M 188,314 L 330,273" stroke="#cccccc" stroke-width="3" stroke-linecap="round" />
  <!-- Clause Line 5 -->
  <path d="M 195,338 L 305,306" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round" />

  <!-- =====================================================================
       3. FLOATING KEY-MAGNIFYING GLASS (SEARCH + RENTAL KEY)
       ===================================================================== -->
  <g filter="url(#heroLensPaperShadow)">
    <!-- KEY HANDLE (Shaft + Classical Key Teeth + Bow) -->
    <!-- Connects to lens bezel at (272, 282), extends down-right at ~42deg to (390, 390) -->
    
    <!-- Key Handle Collar / Mounting Bracket -->
    <path d="M 264,272 L 284,290 L 277,298 L 257,280 Z" fill="#555555" />
    <path d="M 267,274 L 282,288 L 278,294 L 263,280 Z" fill="url(#heroKeyMetallic)" />

    <!-- Main Key Shaft (Beveled 3D Cylinder) -->
    <path d="M 276,284 L 382,382 L 372,393 L 266,295 Z" fill="url(#heroKeyMetallic)" stroke="#666666" stroke-width="1.2" />
    <!-- Specular Highlight along key shaft spine -->
    <line x1="272" y1="288" x2="377" y2="386" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />

    <!-- CLASSICAL KEY BIT (TEETH) -->
    <!-- Protruding downwards-left perpendicular to shaft: ~2 distinct stepped teeth with notch -->
    <!-- Base attachment on shaft from (340, 344) to (378, 379) -->
    <path d="M 346,349 
             L 326,370 
             L 333,377 
             L 343,367 
             L 348,372 
             L 339,381 
             L 346,388 
             L 366,368 
             Z" 
          fill="url(#heroKeyMetallic)" 
          stroke="#666666" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
    <!-- Highlight on Key Tooth Edge -->
    <path d="M 327,370 L 333,377 M 340,381 L 346,388" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- KEY END / BOW RING (Modern Sculpted Loop at tip) -->
    <g transform="translate(390, 390) rotate(42)">
      <!-- Outer Bow Ring -->
      <circle cx="12" cy="0" r="15" fill="url(#heroKeyMetallic)" stroke="#666666" stroke-width="2" />
      <!-- Inner Key Bow Hole -->
      <circle cx="12" cy="0" r="6" fill="#111111" opacity="0.4" stroke="#555555" stroke-width="1.2" />
      <circle cx="12" cy="0" r="4.5" fill="#f8f8f8" opacity="0.9" />
    </g>

    <!-- MAGNIFYING GLASS BEZEL (CIRCULAR 3D FRAME) -->
    <!-- Outer Heavy Metallic Rim -->
    <circle cx="225" cy="235" r="70" fill="none" stroke="url(#heroBezelRim)" stroke-width="10" />
    <!-- Inner Chrome Bevel -->
    <circle cx="225" cy="235" r="65" fill="none" stroke="#e0e0e0" stroke-width="2" opacity="0.8" />
    <!-- Inner Shadow Ring of the Bezel -->
    <circle cx="225" cy="235" r="63.5" fill="none" stroke="#111111" stroke-width="3" opacity="0.5" />

    <!-- CONVEX GLASS LENS SURFACE -->
    <circle cx="225" cy="235" r="62" fill="url(#heroGlassConvex)" />

    <!-- MAGNIFIED & ILLUMINATED CLAUSE INSIDE LENS (Optical Clarity Effect) -->
    <g clip-path="url(#heroLensClip)">
      <clipPath id="heroLensClip">
        <circle cx="225" cy="235" r="61" />
      </clipPath>
      
      <!-- Magnified Grid / Optical Flare Grid -->
      <path d="M 160,248 L 290,211" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#heroCyanGlow)" />
      <path d="M 160,248 L 290,211" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <!-- Text Magnification Sparkle -->
      <circle cx="225" cy="230" r="4" fill="#ffffff" filter="url(#heroCyanGlow)" />
      <!-- Secondary Magnified Line -->
      <path d="M 175,225 L 275,196" stroke="#999999" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- CURVED GLASS CRESCENT SPECULAR GLARE (Upper-Left Reflection) -->
    <path d="M 175,215 
             C 175,185 200,175 230,175 
             C 210,182 192,196 186,218 
             C 183,228 184,238 187,246 
             C 179,238 175,227 175,215 Z" 
          fill="url(#heroGlassGlare)" />
    
    <!-- Secondary Micro Specular Dot (Opposite Rim) -->
    <ellipse cx="265" cy="278" rx="7" ry="2.5" transform="rotate(-35 265 278)" fill="#ffffff" opacity="0.5" />
  </g>

  <!-- =====================================================================
       4. AMBIENT DEPTH SPARKS / CLARITY PARTICLES
       ===================================================================== -->
  <!-- Floating Focus Spark 1 -->
  <circle cx="160" cy="180" r="2" fill="#ffffff" opacity="0.85" filter="url(#heroCyanGlow)" />
  <!-- Floating Focus Spark 2 -->
  <circle cx="305" cy="175" r="2.5" fill="#ffffff" opacity="0.75" filter="url(#heroCyanGlow)" />
  <!-- Floating Focus Spark 3 -->
  <circle cx="280" cy="295" r="2" fill="#ffffff" opacity="0.9" filter="url(#heroCyanGlow)" />
</svg>
