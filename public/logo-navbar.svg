<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Paper Surface Gradient -->
    <linearGradient id="navPaperFace" x1="10" y1="14" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>

    <!-- Metallic Key & Lens Gradient -->
    <linearGradient id="navKeyMetal" x1="18" y1="18" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a0a0a0" />
      <stop offset="70%" stop-color="#666666" />
      <stop offset="100%" stop-color="#555555" />
    </linearGradient>

    <!-- Glass Radial Shader -->
    <radialGradient id="navGlassConvex" cx="21" cy="21" r="10" fx="19" fy="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#a0a0a0" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#666666" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.75" />
    </radialGradient>

    <!-- Glow -->
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" />
    </filter>
  </defs>

  <!-- 1. Drop Shadow under Paper -->
  <ellipse cx="25" cy="38" rx="17" ry="4" fill="#000000" opacity="0.35" />

  <!-- 2. Isometric Paper Stack (3D Thickness) -->
  <!-- Bottom paper layer -->
  <polygon points="12,18 32,12 37,28 17,34" fill="#666666" opacity="0.6" />
  <!-- Paper thickness bottom & left edge -->
  <polygon points="16,33 36,27 36,29 16,35" fill="#999999" />
  <polygon points="11,17 16,33 16,35 11,19" fill="#cccccc" />
  <!-- Main Paper Face -->
  <polygon points="11,17 31,11 36,27 16,33" fill="url(#navPaperFace)" stroke="#cccccc" stroke-width="0.8" />

  <!-- Document Faint Lines -->
  <path d="M 15,20 L 25,17" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" />
  <!-- Active Highlighted Clause beneath lens -->
  <path d="M 16,24 L 32,19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 16,24 L 32,19" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" />
  <!-- Lower faint line -->
  <path d="M 18,28 L 28,25" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" />

  <!-- 3. Floating Key-Magnifying Glass -->
  <!-- Lens Shadow on Paper -->
  <ellipse cx="23" cy="24" rx="9" ry="8" fill="#000000" opacity="0.28" />

  <!-- KEY HANDLE (With distinct teeth) -->
  <!-- Key Shaft extending diagonally to (38, 38) -->
  <path d="M 26,24 L 38,36 L 36,38 L 24,26 Z" fill="url(#navKeyMetal)" />
  <!-- Specular spine -->
  <line x1="25" y1="24" x2="37" y2="36" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" />

  <!-- Key Teeth / Bit -->
  <!-- 2 distinct classical key teeth jutting out to the lower-left -->
  <path d="M 33,31 L 30,34 L 32,36 L 34,34 L 35,35 L 34,36 L 36,38 L 38,36 Z" 
        fill="url(#navKeyMetal)" 
        stroke="#666666" 
        stroke-width="0.5" />

  <!-- Key Bow Ring (End of Handle) -->
  <circle cx="39" cy="39" r="3.5" fill="url(#navKeyMetal)" stroke="#666666" stroke-width="0.6" />
  <circle cx="39" cy="39" r="1.5" fill="#ffffff" />

  <!-- LENS BEZEL (Outer Ring) -->
  <circle cx="20" cy="20" r="8.5" fill="none" stroke="url(#navKeyMetal)" stroke-width="2.2" />
  <circle cx="20" cy="20" r="7.4" fill="none" stroke="#e0e0e0" stroke-width="0.6" opacity="0.9" />

  <!-- CONVEX GLASS -->
  <circle cx="20" cy="20" r="7.2" fill="url(#navGlassConvex)" />

  <!-- Magnified Clause Section Inside Lens -->
  <path d="M 15,22 L 25,19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" filter="url(#navGlow)" />

  <!-- Curved Lens Crescent Glare -->
  <path d="M 15,18 C 15,15 18,14 20,14 C 18,15 16,16 16,19 C 16,20 16,21 17,22 C 16,21 15,19 15,18 Z" fill="#ffffff" opacity="0.9" />
</svg>
